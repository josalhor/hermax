<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 545" role="img" aria-labelledby="title desc">
  <title id="title">Lexicographic optimum with tied travel cost</title>
  <desc id="desc">Both tier-0-optimal assignments have travel cost 60. The solver returns the assignment that sends VIP 1 to Alice and VIP 2 to Bob; Standard 1 is unassigned.</desc>
  <style>
    text { font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; fill: #252a2b; }
    .heading { font-size: 19px; font-weight: 700; }
    .subheading { font-size: 13px; fill: #5f686a; }
    .section { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; fill: #4d6465; }
    .step { fill: #f2f6f4; stroke: #71918b; stroke-width: 1.4; }
    .candidate { fill: #fafbfa; stroke: #c7d0cd; stroke-width: 1.2; }
    .returned { fill: #e5efeb; stroke: #527a74; stroke-width: 1.7; }
    .badge { fill: #dceae5; stroke: #72938d; stroke-width: 1; }
    .badge-text { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; fill: #315f60; }
    .name { font-size: 15px; font-weight: 700; }
    .detail { font-size: 12px; fill: #5d6869; }
    .body { font-size: 13px; fill: #404a4c; }
    .metric { font-size: 18px; font-weight: 700; fill: #315f60; }
    .formula { font-family: "STIX Two Text", "Cambria Math", serif; font-size: 15px; fill: #293b3d; }
    .arrow { fill: none; stroke: #697a78; stroke-width: 1.7; marker-end: url(#arrow); }
    .arrow-label { font-size: 12px; font-weight: 700; fill: #496865; }
    .unassigned { fill: #f4f2ef; stroke: #c6bbb0; stroke-width: 1.1; }
    .unassigned-text { font-size: 13px; fill: #756d65; }
    .canvas { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1f2120; }
      text, .heading, .name, .formula { fill: #f4efe6; }
      .subheading, .detail, .body, .unassigned-text { fill: #cbbca8; }
      .section, .badge-text, .metric, .arrow-label { fill: #82c2b6; }
      .step { fill: #292f2d; stroke: #71918b; }
      .candidate { fill: #292b2a; stroke: #535a57; }
      .returned { fill: #263b36; stroke: #7ba79f; }
      .badge { fill: #273632; stroke: #71918b; }
      .unassigned { fill: #302d2a; stroke: #806f63; }
      .arrow { stroke: #91aaa5; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#697a78"/>
    </marker>
  </defs>

  <rect class="canvas" width="920" height="545"/>
  <text class="heading" x="38" y="38">Lexicographic optimum: tier 0 first, then tier 1</text>
  <text class="subheading" x="38" y="61">Tier-0 priority rules out every assignment that leaves a VIP unserved, regardless of travel cost.</text>

  <text class="section" x="38" y="98">STEP 1 · OPTIMIZE VIP SERVICE</text>
  <rect class="step" x="38" y="113" width="844" height="75" rx="9"/>
  <text class="formula" x="58" y="143">minimize unassigned VIPs</text>
  <text class="metric" x="58" y="171">tier-0 cost = 0</text>
  <text class="body" x="318" y="143">VIP_1 and VIP_2 must both be assigned.</text>
  <text class="body" x="318" y="171">This commits both driver slots, leaving Standard_1 unassigned.</text>

  <path class="arrow" d="M460,188 L460,220"/>
  <text class="arrow-label" x="480" y="210">restrict to tier-0-optimal assignments</text>

  <text class="section" x="38" y="241">STEP 2 · MINIMIZE TRAVEL IN THAT RESTRICTED SET</text>
  <rect class="candidate returned" x="38" y="256" width="404" height="146" rx="9"/>
  <rect class="badge" x="56" y="272" width="142" height="20" rx="9"/>
  <text class="badge-text" x="67" y="286">RETURNED SOLUTION</text>
  <text class="name" x="56" y="319">VIP_1 → Alice   (50)</text>
  <text class="name" x="56" y="345">VIP_2 → Bob     (10)</text>
  <text class="metric" x="56" y="380">travel cost = 60</text>

  <rect class="candidate" x="478" y="256" width="404" height="146" rx="9"/>
  <text class="detail" x="496" y="286">ANOTHER TIER-1 OPTIMUM</text>
  <text class="name" x="496" y="319">VIP_1 → Bob     (10)</text>
  <text class="name" x="496" y="345">VIP_2 → Alice   (50)</text>
  <text class="metric" x="496" y="380">travel cost = 60</text>

  <rect class="unassigned" x="38" y="424" width="844" height="48" rx="8"/>
  <text class="unassigned-text" x="58" y="453">Standard_1 is unassigned in both cases: the two driver capacities are consumed by the tier-0 VIP requirement.</text>

  <text class="section" x="38" y="505">REPORTED RESULT</text>
  <text class="body" x="184" y="505">tier_costs = [0, 60]  ·  returned assignment: VIP_1→Alice, VIP_2→Bob, Standard_1→None</text>
</svg>
