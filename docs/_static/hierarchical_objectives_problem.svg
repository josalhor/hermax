<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Lexicographic assignment model with VIP priority</title>
  <desc id="desc">The model first minimizes unassigned VIP clients, then minimizes travel cost only among assignments that attain the first-tier optimum.</desc>
  <style>
    text { font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; fill: #252a2b; }
    .heading { font-size: 19px; font-weight: 700; }
    .subheading { font-size: 13px; fill: #5f686a; }
    .section { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; fill: #4d6465; }
    .tier0 { fill: #f5f0ee; stroke: #9a7c70; stroke-width: 1.4; }
    .tier1 { fill: #f2f6f4; stroke: #71918b; stroke-width: 1.4; }
    .client { fill: #fafafa; stroke: #c7cfcc; stroke-width: 1.2; }
    .vip { fill: #f5eae6; stroke: #aa8071; stroke-width: 1.4; }
    .driver { fill: #f4f7f5; stroke: #78928e; stroke-width: 1.3; }
    .name { font-size: 15px; font-weight: 700; }
    .detail { font-size: 12px; fill: #5d6869; }
    .tier-title { font-size: 17px; font-weight: 700; }
    .tier0-text { fill: #73594d; }
    .tier1-text { fill: #315f60; }
    .body { font-size: 13px; fill: #404a4c; }
    .formula { font-family: "STIX Two Text", "Cambria Math", serif; font-size: 15px; fill: #293b3d; }
    .arrow { fill: none; stroke: #697a78; stroke-width: 1.7; marker-end: url(#arrow); }
    .arrow-label { font-size: 12px; font-weight: 700; fill: #496865; }
    .lock { fill: #e2ece8; stroke: #72928c; stroke-width: 1.2; }
    .lock-text { font-size: 13px; font-weight: 700; fill: #315f60; }
    .canvas { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1f2120; }
      text, .heading, .name, .formula { fill: #f4efe6; }
      .subheading, .detail, .body { fill: #cbbca8; }
      .section, .tier1-text, .lock-text, .arrow-label { fill: #82c2b6; }
      .tier0-text { fill: #d9b7a0; }
      .tier0 { fill: #302d2a; stroke: #9b8172; }
      .tier1 { fill: #292f2d; stroke: #71918b; }
      .client { fill: #292b2a; stroke: #535a57; }
      .vip { fill: #382e2a; stroke: #a58474; }
      .driver { fill: #293330; stroke: #71918b; }
      .lock { fill: #273632; stroke: #71918b; }
      .arrow { stroke: #91aaa5; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#697a78"/>
    </marker>
  </defs>

  <rect class="canvas" width="920" height="500"/>
  <text class="heading" x="38" y="38">Lexicographic objectives: optimize tiers in order</text>
  <text class="subheading" x="38" y="61">Tier 1 is not traded against tier 0; it is optimized only after the tier-0 optimum is fixed.</text>

  <text class="section" x="38" y="98">ASSIGNMENT INSTANCE</text>
  <rect class="client vip" x="38" y="113" width="175" height="58" rx="8"/>
  <text class="name" x="54" y="139">VIP_1</text><text class="detail" x="54" y="158">priority client</text>
  <rect class="client vip" x="231" y="113" width="175" height="58" rx="8"/>
  <text class="name" x="247" y="139">VIP_2</text><text class="detail" x="247" y="158">priority client</text>
  <rect class="client" x="424" y="113" width="175" height="58" rx="8"/>
  <text class="name" x="440" y="139">Standard_1</text><text class="detail" x="440" y="158">ordinary client</text>
  <rect class="driver" x="657" y="113" width="106" height="58" rx="8"/>
  <text class="name" x="673" y="139">Alice</text><text class="detail" x="673" y="158">cost 50</text>
  <rect class="driver" x="775" y="113" width="106" height="58" rx="8"/>
  <text class="name" x="791" y="139">Bob</text><text class="detail" x="791" y="158">cost 10</text>
  <text class="detail" x="657" y="192">each driver serves at most one client</text>

  <rect class="tier0" x="38" y="223" width="844" height="91" rx="9"/>
  <text class="tier-title tier0-text" x="58" y="253">Tier 0  ·  strict priority</text>
  <text class="formula" x="58" y="281">minimize  unassigned VIP clients</text>
  <text class="body" x="388" y="281">Before travel matters, serve as many VIPs as possible.</text>
  <text class="body" x="58" y="302">Here both VIPs can be served, so the tier-0 optimum is 0 unassigned VIPs.</text>

  <path class="arrow" d="M460,314 L460,349"/>
  <rect class="lock" x="274" y="349" width="372" height="42" rx="8"/>
  <text class="lock-text" x="294" y="375">Harden tier-0 optimum: unassigned VIPs = 0</text>

  <path class="arrow" d="M460,391 L460,410"/>
  <rect class="tier1" x="38" y="410" width="844" height="60" rx="9"/>
  <text class="tier-title tier1-text" x="58" y="438">Tier 1</text>
  <text class="formula" x="136" y="438">minimize travel cost</text>
  <text class="body" x="381" y="438">only among assignments that still serve both VIPs</text>
  <text class="detail" x="58" y="458">Both driver slots are committed to VIPs; Standard_1 has no remaining capacity.</text>
</svg>
